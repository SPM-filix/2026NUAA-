  #     DB_HOST: db
  #     DB_PORT: 3306
  #     DB_NAME: ${DB_NAME:-recycle}
  #     DB_USER: ${DB_USER:-recycle}
  #     DB_PASSWORD: ${DB_PASSWORD}
  #     JWT_SECRET: ${JWT_SECRET}
  #     JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
  #     UPLOAD_DIR: /app/uploads
  #   volumes:
  #     - uploads_data:/app/uploads
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - recycle-net

volumes:
  mysql_data:
  uploads_data:

networks:
  recycle-net:
    driver: bridge
